<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>you're in. — syp</title>
<link rel="icon" type="image/png" sizes="32x32" href="favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
  height: 100%;
  font-family: 'Inter', sans-serif;
  background: #0A0A0A;
  color: #FFFFFF;
  -webkit-font-smoothing: antialiased;
}
body {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  padding: 40px 24px;
  position: relative;
  overflow: hidden;
}

/* Background glow */
.bg-glow {
  position: fixed;
  inset: 0;
  background: radial-gradient(ellipse 60% 50% at 50% 60%, rgba(29,203,168,0.07) 0%, transparent 70%);
  pointer-events: none;
  z-index: 0;
}

/* Nav */
nav {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  z-index: 100;
  padding: 0 32px;
  height: 64px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: rgba(10,10,10,0.8);
  backdrop-filter: blur(20px);
  border-bottom: 1px solid rgba(255,255,255,0.06);
}
.nav-logo {
  display: flex;
  align-items: center;
  gap: 10px;
  text-decoration: none;
}
.nav-logo img {
  height: 28px;
  width: auto;
}
.nav-logo span {
  font-size: 20px;
  font-weight: 800;
  color: #FFFFFF;
  letter-spacing: -0.04em;
}
.nav-back {
  font-size: 13px;
  color: rgba(255,255,255,0.45);
  text-decoration: none;
  display: flex;
  align-items: center;
  gap: 6px;
  transition: color 0.2s;
}
.nav-back:hover { color: rgba(255,255,255,0.8); }
.nav-back svg { width: 14px; height: 14px; }

/* Main content */
.content {
  position: relative;
  z-index: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  max-width: 680px;
  width: 100%;
  animation: fadeUp 0.7s ease both;
}
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}

/* Confirmation badge */
.badge {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  background: rgba(29,203,168,0.12);
  border: 1px solid rgba(29,203,168,0.25);
  border-radius: 20px;
  padding: 6px 16px;
  font-size: 12px;
  font-weight: 500;
  color: #1DCBA8;
  letter-spacing: 0.04em;
  margin-bottom: 24px;
}
.badge-dot {
  width: 6px;
  height: 6px;
  background: #1DCBA8;
  border-radius: 50%;
}

/* Headline */
h1 {
  font-size: clamp(36px, 6vw, 64px);
  font-weight: 800;
  line-height: 1.04;
  letter-spacing: -0.03em;
  color: #FFFFFF;
  margin-bottom: 16px;
}
h1 em {
  font-style: normal;
  color: #1DCBA8;
}

.subhead {
  font-size: 16px;
  font-weight: 300;
  color: rgba(255,255,255,0.45);
  line-height: 1.65;
  max-width: 440px;
  margin-bottom: 44px;
}

/* Video container */
.video-wrap {
  width: 100%;
  max-width: 600px;
  border-radius: 20px;
  overflow: hidden;
  position: relative;
  background: #111;
  box-shadow: 0 32px 80px rgba(0,0,0,0.6), 0 0 0 1px rgba(29,203,168,0.15);
  margin-bottom: 40px;
  animation: fadeUp 0.7s ease 0.2s both;
}
.video-wrap video {
  width: 100%;
  display: block;
  border-radius: 20px;
}

/* Caption */
.caption {
  font-size: 14px;
  color: rgba(255,255,255,0.35);
  margin-bottom: 44px;
  letter-spacing: 0.02em;
  animation: fadeUp 0.7s ease 0.35s both;
}

/* CTA */
.cta-group {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 14px;
  animation: fadeUp 0.7s ease 0.45s both;
}
.btn-primary {
  background: #FFFFFF;
  color: #0A0A0A;
  border: none;
  padding: 15px 40px;
  border-radius: 8px;
  font-family: 'Inter', sans-serif;
  font-size: 14px;
  font-weight: 700;
  cursor: pointer;
  text-decoration: none;
  display: inline-block;
  transition: background 0.2s, transform 0.15s;
  letter-spacing: 0.01em;
}
.btn-primary:hover { background: #E8E8E8; transform: translateY(-1px); }
.social-links {
  display: flex;
  gap: 20px;
  align-items: center;
}
.social-link {
  font-size: 12px;
  color: rgba(255,255,255,0.35);
  text-decoration: none;
  transition: color 0.2s;
  display: flex;
  align-items: center;
  gap: 5px;
}
.social-link:hover { color: rgba(255,255,255,0.7); }
.social-link svg { width: 14px; height: 14px; }

@media (max-width: 600px) {
  nav { padding: 0 20px; }
  body { padding: 80px 20px 40px; }
}
</style>
</head>
