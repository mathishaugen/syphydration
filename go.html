  text-transform: uppercase;

  margin: 34px 0 12px;
}

  display: flex;
  align-items: center;

  background: var(--dark-2);

  padding: 15px 17px;
  margin-bottom: 10px;
  text-decoration: none;
  color: var(--white);
  transition: border-color .15s ease, transform .15s ease, background .15s ease;
}
.card:hover {
  border-color: rgba(29,203,168,0.45);

.card-body { flex: 1; min-width: 0; }

<div class="wrap">

  <div class="brand">

  <p class="thesis">
    You don't have a hydration problem.<br><em>You have a measurement problem.</em>

    Join the waitlist
    <span class="sub">Founding members get early access &amp; founding pricing</span>

  <div class="section-label">What we're posting about</div>
  <div id="post-links"></div>

    </div>

</div>

<script>
/* ---------------------------------------------------------------------------
   LINK-IN-BIO HUB — 30-day campaign, Aug 2026

   WHY THIS PAGE EXISTS
   Instagram feed posts and carousels carry no clickable link, so they cannot
   be attributed with a per-post UTM. The bio link points here permanently;
   visitors tap the entry matching the post they just saw. That converts an
   unattributable IG carousel into a tagged click.

   HOW TO UPDATE (weekly, ~2 minutes)
   Edit POSTS below. Newest first. Keep 4-6 entries — a long list kills the
   tap rate. Drop the oldest as you add. `slug` MUST match the slug in
   tracking/utm-link-map.csv or the GA4 report won't line up.

   franchise: 'measurement' | 'build' | 'athletes'
--------------------------------------------------------------------------- */

var POSTS = [
  { slug: 'w1-ig-a1',  title: "You don't have a hydration problem",         meta: 'Carousel — why hydration is the only untracked input', franchise: 'measurement', dest: '/' },
  { slug: 'w1-ig-thu', title: 'What your wearable actually measures',       meta: "Carousel — and what it doesn't",                       franchise: 'measurement', dest: '/' },
  { slug: 'w1-ig-tue', title: 'Guess vs actual',                            meta: 'Reel — we asked athletes after practice',               franchise: 'measurement', dest: '/' },
  { slug: 'w1-ig-fri', title: '"Water I was completely guessing at"',       meta: 'Hugo, founding athlete',                                franchise: 'athletes',    dest: '/' }
];

var PROGRAM_LINKS = [
  { slug: 'hub-pilot',  title: 'Fall 2026 pilot — two slots left', meta: 'For athletic trainers & performance staff', franchise: 'build', dest: '/b2b' },
  { slug: 'hub-brief',  title: 'The research brief',               meta: 'Study design, cohort, what we measure',      franchise: 'build', dest: '/b2b' }
];

var CAMPAIGN = 'syp30';

function tagged(dest, slug) {
  var sep = dest.indexOf('?') === -1 ? '?' : '&';
  return dest + sep + 'utm_source=instagram&utm_medium=bio_link' +
         '&utm_campaign=' + CAMPAIGN + '&utm_content=' + encodeURIComponent(slug);
}

function render(items, mountId) {
  var mount = document.getElementById(mountId);
  if (!mount) return;
  items.forEach(function (p) {
    var a = document.createElement('a');
    a.className = 'card';
    a.href = tagged(p.dest, p.slug);
    a.innerHTML =
      '<div class="card-body">' +
        '<div class="card-title">' +
          '<span class="tag tag-' + p.franchise + '">' + p.franchise + '</span>' +
          p.title.replace(/</g, '&lt;') +
        '</div>' +
        '<div class="card-meta">' + p.meta.replace(/</g, '&lt;') + '</div>' +
      '</div>' +
      '<div class="card-arrow">&rsaquo;</div>';
    a.addEventListener('click', function () {
      if (typeof gtag === 'function') {
        gtag('event', 'link_hub_click', {
          link_slug: p.slug,
          link_title: p.title,
          franchise: p.franchise,
          destination: p.dest
        });
      }
    });
    mount.appendChild(a);
  });
}

render(POSTS, 'post-links');
render(PROGRAM_LINKS, 'program-links');

/* Primary waitlist CTA carries its own slug so hub-driven signups are
   separable from post-driven ones in GA4. */
var primary = document.getElementById('primary-cta');
primary.href = tagged('/', 'hub-primary');
primary.addEventListener('click', function () {
  if (typeof gtag === 'function') {
    gtag('event', 'link_hub_click', {
      link_slug: 'hub-primary',
      link_title: 'Join the waitlist',
      franchise: 'primary',
      destination: '/'
    });
  }
});
</script>
